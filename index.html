<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧠%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>메타인지 체크리스트 v4 | 대전과학고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a;--bg2:#1e293b;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.13);--text:#f8fafc;--text2:#e2e8f0;--sub:#cbd5e1;--muted:#a3b1c6;
  --accent:#818cf8;--accent2:#a5b4fc;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--focus:#fde68a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}
body{background:var(--bg) linear-gradient(160deg,#0f172a,#1e293b 60%,#0f172a) fixed;color:var(--text);min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:540px;margin:0 auto;padding:28px 16px 72px}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.h1{font-size:22px;font-weight:900;line-height:1.35;color:var(--accent2)}
.h2{font-size:17px;font-weight:800;margin:0}
.h3{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:10px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:0 0 6px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.err{font-size:12.5px;color:var(--bad);margin:-6px 0 10px}
.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:16px;margin-bottom:12px;outline:none}
.field:focus{border-color:var(--accent)}
.field[aria-invalid="true"]{border-color:var(--bad)}
textarea.field{line-height:1.6;resize:vertical;margin-bottom:0}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;text-align:center;transition:opacity .15s}
.btn-primary{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;box-shadow:0 6px 24px rgba(99,102,241,.3)}
.btn-ghost{border:1px solid var(--line);color:var(--sub)}
.btn-soft{border:1px solid rgba(129,140,248,.4);background:rgba(129,140,248,.1);color:var(--accent2)}
.btn-save{background:linear-gradient(135deg,#f59e0b,#f97316);color:#1c1204}
.btn-done{background:#059669;color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-sm{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.banner{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:16px}
.banner.info{background:rgba(129,140,248,.1);border:1px solid rgba(129,140,248,.3);color:var(--text2)}
.banner.warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:#fde68a}
.banner.safe{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.35);color:var(--text2)}
.banner b{color:var(--text)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--sub);line-height:1.5;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:#818cf8;flex-shrink:0}
/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.tile .v{font-size:20px;font-weight:900;color:var(--text)}
.tile .k{font-size:11.5px;color:var(--muted);margin-top:2px}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}}
/* section picker */
.sec-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.07);text-align:left;margin-bottom:8px}
.sec-btn .t{font-size:14px;font-weight:700;color:var(--sub)}
.sec-btn .s{font-size:12px;color:var(--muted);margin-top:2px}
.box{width:22px;height:22px;border-radius:6px;border:2px solid #64748b;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
/* checklist */
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog>div{height:100%;background:linear-gradient(90deg,#6366f1,#a5b4fc);border-radius:3px;transition:width .4s}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 16px;padding-bottom:4px}
.tab{padding:8px 14px;border-radius:20px;border:2px solid transparent;background:var(--card);color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
.sec-head{margin-bottom:16px;padding:14px 16px;border-radius:14px;border-left:4px solid}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;transition:border-color .2s}
.item.ok{border-color:rgba(129,140,248,.45)}
.item .meta{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.no{font-size:12px;color:var(--muted);font-weight:700}
.kind{font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.07);padding:2px 7px;border-radius:5px;margin-left:auto}
.q{font-size:15px;line-height:1.6;color:var(--text2);font-weight:500;margin-bottom:6px}
.sub{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:10px}
.quote{border-left:3px solid var(--accent);background:rgba(129,140,248,.08);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--text2);margin-bottom:10px;line-height:1.55}
.seg{display:flex;gap:8px}
.seg-btn{flex:1;padding:10px 0;border-radius:10px;border:2px solid rgba(255,255,255,.1);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .12s}
.seg-sym{font-size:20px;font-weight:900;line-height:1.2}
.seg-txt{font-size:12px;font-weight:700}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.pct-top{display:flex;align-items:center;gap:12px}
.pct-val{font-size:26px;font-weight:900;min-width:70px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#818cf8;border:3px solid #1e293b}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#818cf8;border:3px solid #1e293b}
input[type=range].untouched::-webkit-slider-thumb{background:#64748b}
input[type=range].untouched::-moz-range-thumb{background:#64748b}
.quick-pcts{display:flex;gap:6px;margin-top:10px}
.quick-pcts button{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--sub)}
.quick-pcts button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent2);background:rgba(129,140,248,.12)}
.strat-cat{font-size:12px;font-weight:700;color:var(--accent2);margin:10px 0 6px}
.strat-cat span{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 10px;border-radius:9px;border:2px solid rgba(255,255,255,.1);color:var(--sub);font-size:13px;font-weight:600}
.chip b{color:var(--accent2);margin-right:4px}
.chip[aria-pressed="true"]{border-color:#818cf8;background:rgba(129,140,248,.16);color:#e0e7ff}
.picked{margin-top:10px;padding:10px 12px;background:rgba(129,140,248,.07);border-radius:10px}
.picked div{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.5}
.nudge{margin-top:8px;font-size:12.5px;color:#fde68a;line-height:1.5}
.extra{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.nav{display:flex;gap:10px;margin-top:20px}
/* results */
.ring{position:relative;width:150px;height:150px;margin:14px auto}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:88px 1fr 46px;gap:10px;align-items:center}
.bar-lbl{font-size:13px;color:var(--sub);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:0 4px 4px 0;transition:width .6s}
.bar-val{font-size:13px;font-weight:700;color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.li:last-child{border-bottom:0}
.li .n{font-size:16px;font-weight:900;color:var(--accent);width:26px;text-align:center;flex-shrink:0}
.li .t{font-size:14px;font-weight:700;color:var(--text2)}
.li .d{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.step{background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(192,132,252,.1));border:1px solid rgba(165,180,252,.35)}
.step p{font-size:14.5px;line-height:1.7;color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.breath-box{max-width:360px;width:100%;text-align:center}
.breath-circle{width:170px;height:170px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c7d2fe,#6366f1 60%,#3730a3);transform:scale(.55);transition:transform 6s ease-in-out;opacity:.9}
.breath-circle.in{transform:scale(1);transition-duration:4s}
.breath-circle.out{transform:scale(.55);transition-duration:6s}
.breath-phase{font-size:20px;font-weight:800;margin-bottom:8px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:92%;text-align:center;line-height:1.5}
.toast.show{opacity:1}
.toast.success{background:#047857}
.toast.error{background:#b91c1c}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .35s ease-out both}
@media (prefers-reduced-motion:reduce){
  .fade{animation:none}
  .breath-circle,.breath-circle.in,.breath-circle.out{transition:none;transform:scale(.8)}
  .bar-fill,.prog>div{transition:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function(){
"use strict";
var h=React.createElement, useState=React.useState, useEffect=React.useEffect, useRef=React.useRef;
var CFG=window.CONFIG||{};
var API=String(CFG.WEB_APP_URL||"").trim();
var APP_VERSION="4.0.0";
var SCORE_VERSION=2;
var BACKEND_MAJOR=2;

/* ───────── 저장소 (기기 내) ───────── */
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  del:function(k){try{localStorage.removeItem(k);}catch(e){}}
};
var K={profile:"mc4.profile",draft:"mc4.draft",log:"mc4.log",queue:"mc4.queue",remind:"mc4.remind"};

/* ───────── 문항 ─────────
 * v3 문항을 유지하되, 사용 데이터에서 드러난 약점에 맞춰 다음을 바꿈
 *  - Q0  지난번 다짐 실천 여부 (이 기기에 지난 다짐이 있을 때만 표시)
 *  - Q1  목표 한 줄 적기(선택) 추가 → Q4 달성도와 연결
 *  - Q5  "내일 개선점" 자유 서술 → "언제 → 무엇을" 실행 계획
 *  - Q6·A10 1분 호흡 안내 버튼
 */
var SECTIONS={
  quick:{id:"quick",title:"Quick-Check",icon:"⚡",subtitle:"매 활동 후 2분 자기 점검",color:"#F59E0B",items:[
    {no:"Q0",text:"지난번에 정한 다짐을 실천했다.",type:"조절",input:"rating",needsPrev:true},
    {no:"Q1",text:"오늘 학습/연구의 구체적 목표를 설정하였다. (무엇을, 어디까지)",type:"계획",input:"rating",goal:true},
    {no:"Q2",text:"학습 내용 특성에 맞는 인지전략을 선택하였다.",type:"전략",input:"strategy",sub:"오늘 쓴 전략을 고르세요. 전략마다 '이럴 때 쓰기'가 함께 보입니다."},
    {no:"Q3",text:"핵심 개념을 자기 언어로 설명할 수 있는가? (자기 테스트)",type:"점검",input:"rating"},
    {no:"Q4",text:"오늘 목표 달성도는 몇 %인가?",type:"평가",input:"percent",showGoal:true},
    {no:"Q5",text:"다음 학습에서 바꿀 점을 '언제 → 무엇을'로 적어 보세요.",type:"조절",input:"plan",sub:"\"더 집중하자\"보다 \"폰 알림이 오면 → 가방에 넣는다\"처럼 상황과 행동을 정하면 실천하기 쉬워요."},
    {no:"Q6",text:"집중이 흐트러질 때 알아차림 → 호흡으로 몰입을 회복했다. (편도체 안정화)",type:"조절",input:"rating",breath:true,sub:"투쟁-도망-경직 같은 정서 반응에서 빠져나오는 1분 호흡"},
    {no:"Q7",text:"오늘 감사 1가지 또는 자기확언 한 문장을 적어 보세요. (mPFC 활성화)",type:"조절",input:"text",placeholder:"예) 친구의 설명 덕에 이해가 깊어졌다 / 나는 매일 한 걸음씩 성장하고 있다"},
    {no:"Q8",text:"오늘 학습에 \"정확한 피드백 루프\"가 작동했다. (정답 확인·해설 비교·재시도)",type:"전략",input:"rating",sub:"단순 반복이 아닌 Deliberate Practice의 핵심"}
  ]},
  A:{id:"A",title:"학습 전 — 계획",icon:"🎯",subtitle:"Before Learning",color:"#60A5FA",items:[
    {no:"1",text:"오늘의 학습/연구 목표를 구체적으로 설정하였다. (무엇을, 어디까지, 얼마나)",type:"계획",input:"rating"},
    {no:"2",text:"목표가 달성 가능하면서도 도전적인 수준인지 확인하였다.",type:"계획",input:"rating"},
    {no:"3",text:"목표 달성 여부를 확인할 수 있는 구체적 기준을 마련하였다. (페이지, 문제 수, 실험 단계)",type:"계획",input:"rating"},
    {no:"4",text:"학습 내용 특성(암기/이해/적용/분석)에 맞는 인지전략을 선택하였다.",type:"전략",input:"rating"},
    {no:"5",text:"선택한 인지전략을 기록하세요.",type:"전략",input:"strategy",sub:"오늘 사용할 전략을 고르세요."},
    {no:"6",text:"학습/연구에 필요한 시간을 예측하고 배분하였다.",type:"계획",input:"rating"},
    {no:"7",text:"집중할 수 있는 환경을 조성하였다. (방해 요소 제거)",type:"계획",input:"rating"},
    {no:"8",text:"이 학습/연구를 하는 이유(목적·가치)를 인식하고 있다.",type:"계획",input:"rating"},
    {no:"9",text:"오늘의 목표를 달성할 수 있다는 자신감은 어느 정도인가?",type:"계획",input:"scale5",lo:"전혀 없다",hi:"매우 높다"},
    {no:"10",text:"학습 전 1분 호흡·알아차림으로 마음을 가라앉혔다. (편도체 안정화)",type:"조절",input:"rating",breath:true}
  ]},
  B:{id:"B",title:"학습 중 — 점검",icon:"🔍",subtitle:"During Learning",color:"#A78BFA",items:[
    {no:"11",text:"지금 학습하는 내용을 자기 언어로 설명할 수 있는가?",type:"점검",input:"rating"},
    {no:"12",text:"핵심 개념·원리를 정확히 이해하고 있는가?",type:"점검",input:"rating"},
    {no:"13",text:"새로 배운 내용이 기존 지식과 어떻게 연결되는지 파악하였는가?",type:"점검",input:"rating"},
    {no:"14",text:"현재 사용 중인 인지전략이 목표 달성에 효과적인가?",type:"점검",input:"rating"},
    {no:"15",text:"전략이 효과적이지 않다면 다른 전략으로 전환했는가?",type:"조절",input:"rating"},
    {no:"16",text:"계획한 시간 대비 진도가 적절한가?",type:"점검",input:"rating"},
    {no:"17",text:"집중력이 유지되고 있는가? 방해 요소가 발생하지 않았는가?",type:"점검",input:"rating"},
    {no:"18",text:"실패·막힘에 대해 \"성장 기회\"로 의미를 부여하였다. (성장 마인드셋)",type:"조절",input:"rating"},
    {no:"19",text:"긴장·스트레스를 \"수행을 돕는 신체 자원\"으로 재해석하였다. (스트레스 긍정 마인드셋)",type:"조절",input:"rating"}
  ]},

function fmtDate(iso){var d=new Date(iso);if(isNaN(d.getTime()))return "-";function p(n){return String(n).padStart(2,"0");}return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}

function weekStats(recs){
  if(!recs.length)return {thisWeek:0,streak:0,daysSince:null};
  var keys={};recs.forEach(function(r){var w=weekStart(r.when);if(!isNaN(w))keys[w.getTime()]=1;});
  var cur=weekStart(Date.now()),k=new Date(cur);
  if(!keys[k.getTime()])k.setDate(k.getDate()-7);
  var streak=0;while(keys[k.getTime()]){streak++;k.setDate(k.getDate()-7);}
  var thisWeek=recs.filter(function(r){return weekStart(r.when).getTime()===cur.getTime();}).length;
  var last=Math.max.apply(null,recs.map(function(r){return new Date(r.when).getTime()||0;}));
  return {thisWeek:thisWeek,streak:streak,daysSince:Math.floor((Date.now()-last)/864e5)};
}

      active.length>1&&h("div",{className:"card fade"},h("div",{className:"h3"},"📋 섹션별"),
        h(Bars,{rows:active.filter(function(s){return r.ss[s.id]!=null;}).map(function(s){return {label:s.icon+" "+(s.id==="quick"?"QC":s.title.split(" — ")[0]),value:r.ss[s.id],color:s.color};})})),
      h("div",{className:"card fade"},
        h("div",{className:"h3"},"🧩 인지전략"),
        picked.length>0?h(React.Fragment,null,
          picked.map(function(n){var s=STRAT_BY_NO[n];return h("div",{key:n,className:"li"},h("span",{className:"n"},n),h("div",null,h("div",{className:"t"},s.name+" · "+s.cat),h("div",{className:"d"},"이럴 때: "+s.when)));}),
          h("div",{className:"hint mt8"},"고른 전략 "+picked.length+"개 중 이해·연구 전략 "+deep+"개")):h("div",{className:"hint"},"이번에는 전략을 고르지 않았어요."),
        recs.length>0&&h("div",{className:"mt12"},h("div",{className:"lbl"},"다음에 시도해 볼 전략"+(weakType?" ("+weakType+" 보완)":"")),
          recs.map(function(s){return h("div",{key:s.no,className:"li"},h("span",{className:"n"},s.no),h("div",null,h("div",{className:"t"},s.name),h("div",{className:"d"},s.desc),h("div",{className:"d",style:{color:"#c7d2fe"}},"이럴 때: "+s.when)));}))),
      texts.length>0&&h("div",{className:"card fade"},h("div",{className:"h3"},"📝 나의 서술"),
        texts.map(function(it){return h("div",{key:keyOf(it),className:"quote"},h("div",{className:"hint"},"#"+it.no+" "+it.text),resp[keyOf(it)]);})),
      h("button",{type:"button",className:"btn "+(isSaved?"btn-done":"btn-save"),disabled:busy||isSaved,onClick:function(){save(r);}},
        busy?"저장 중...":saveState==="saved"?"✓ 저장 완료":saveState==="local"?"✓ 이 기기에 저장됨":saveState==="queued"?"✓ 기기에 보관됨 (나중에 전송)":"📤 결과 저장하기"),
      isSaved&&h("div",{className:"mt12"},h(Reminder)),
      h("div",{className:"nav"},
        h("button",{type:"button",className:"btn btn-ghost",onClick:function(){setScreen("home");}},"🏠 처음으로"),
        h("button",{type:"button",className:"btn btn-ghost",onClick:function(){setCurSec(0);setScreen("checklist");}},isSaved?"✏️ 고쳐서 다시 저장":"✏️ 수정하기")));
  }

  /* ─── HISTORY ─── */
  function History(){
    var body;
    if(!hist||hist.loading)body=h("div",{className:"card center hint",role:"status"},"기록을 불러오는 중...");
    else if(hist.error)body=h("div",{className:"banner warn",role:"alert"},hist.error);
    else if(!hist.recs.length)body=h(React.Fragment,null,hist.warn&&h("div",{className:"banner warn"},hist.warn),h("div",{className:"card center"},h("div",{style:{fontSize:"36px"}},"📭"),h("div",{className:"h3 mt8"},"아직 기록이 없어요"),h("div",{className:"hint"},"체크리스트를 마치고 '결과 저장하기'를 누르면 여기에 쌓여요.")));
    else{
      var recs=hist.recs,N=recs.length,ws=weekStats(recs);
      var sc=recs.filter(function(r){return r.score!=null;}).map(function(r){return r.score;});
      var v4=recs.filter(function(r){return r.sv>=2&&r.score!=null;}).map(function(r){return r.score;});
      var tAcc={};recs.forEach(function(r){Object.keys(r.types||{}).forEach(function(k){(tAcc[k]=tAcc[k]||[]).push(Number(r.types[k]));});});
      var tAvg={};Object.keys(tAcc).forEach(function(k){tAvg[k]=mean(tAcc[k]);});
      var cat={},cnt={},total=0;recs.forEach(function(r){r.strats.forEach(function(n){var s=STRAT_BY_NO[n];if(!s)return;cat[s.cat]=(cat[s.cat]||0)+1;cnt[n]=(cnt[n]||0)+1;total++;});});
      var top=Object.keys(cnt).map(Number).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,3);
      var deepShare=total?((cat["깊은 이해"]||0)+(cat["연구활동"]||0))/total:null;
      var plans=recs.filter(function(r){return r.plan;}).slice(-5).reverse();
      var weakT=null,lowV=1;Object.keys(tAvg).forEach(function(k){if(tAvg[k]<lowV){lowV=tAvg[k];weakT=k;}});
      var lines=[];
      if(ws.daysSince!=null)lines.push(ws.daysSince>=7?"마지막 체크 후 "+ws.daysSince+"일이 지났어요. 메타인지는 자주 돌아볼수록 자라요.":"이번 주 "+ws.thisWeek+"회, "+ws.streak+"주 연속으로 체크했어요.");
      if(weakT)lines.push("누적으로 가장 낮은 요소는 '"+weakT+"'("+Math.round(lowV*100)+"%)예요. "+TYPE_TIPS[weakT]);
      if(deepShare!=null)lines.push(deepShare<.5?"고른 전략 중 이해·연구 전략은 "+Math.round(deepShare*100)+"%예요. 외우기 전략에 기대고 있다면 자기 질문·설명하기를 섞어 보세요.":"고른 전략의 "+Math.round(deepShare*100)+"%가 이해·연구 전략이에요. 깊이 있게 공부하고 있어요.");
      if(top.length)lines.push("자주 쓰는 전략: "+top.map(function(n){return STRAT_BY_NO[n].name+"("+cnt[n]+"회)";}).join(", "));
      body=h(React.Fragment,null,
        hist.warn&&h("div",{className:"banner warn"},hist.warn),
        h("div",{className:"tiles"},
          h("div",{className:"tile"},h("div",{className:"v"},N),h("div",{className:"k"},"전체 회차")),
          h("div",{className:"tile"},h("div",{className:"v"},ws.thisWeek),h("div",{className:"k"},"이번 주")),
          h("div",{className:"tile"},h("div",{className:"v"},ws.streak),h("div",{className:"k"},"연속 주")),
          h("div",{className:"tile"},h("div",{className:"v"},v4.length?Math.round(mean(v4)):sc.length?Math.round(mean(sc)):"-"),h("div",{className:"k"},v4.length?"평균(v4)":"평균 점수"))),
        h("div",{className:"card step"},h("div",{className:"h3",style:{color:"#e0e7ff"}},"🪄 나의 메타인지 패턴"),lines.map(function(l,i){return h("p",{key:i,style:{fontSize:"14px",marginBottom:"8px"}},"▸ "+l);})),
        sc.length>=2&&h("div",{className:"card"},h("div",{className:"h3"},"📈 점수 추세"),h(TrendLine,{recs:recs})),
        Object.keys(tAvg).length>0&&h("div",{className:"card"},h("div",{className:"h3"},"🧠 요소별 평균"),
          h(Bars,{rows:TYPES.filter(function(t){return tAvg[t]!=null;}).map(function(t){return {label:TM[t].i+" "+t,value:tAvg[t],color:TM[t].c};})})),
        total>0&&h("div",{className:"card"},h("div",{className:"h3"},"🧩 고른 전략 종류 ("+total+"회)"),
          h(Bars,{rows:CATS.map(function(c){return {label:c[0],value:(cat[c[0]]||0)/total,color:c[0]==="단순 기억"?"#94a3b8":c[0]==="필수 기억"?"#60a5fa":c[0]==="깊은 이해"?"#818cf8":"#fb923c",right:(cat[c[0]]||0)+"회"};})})),
        plans.length>0&&h("div",{className:"card"},h("div",{className:"h3"},"🔁 지난 다짐 돌아보기"),
          plans.map(function(r,i){return h("div",{key:i,className:"quote"},h("div",{className:"hint"},fmtShort(r.when)),r.plan);})),
        h("div",{className:"card"},h("div",{className:"h3"},"📅 최근 기록"),
          recs.slice().reverse().slice(0,8).map(function(r,i){return h("div",{key:i,className:"li"},
            h("span",{className:"n",style:{fontSize:"15px"}},r.score==null?"-":Math.round(r.score)),
            h("div",{style:{minWidth:0}},h("div",{className:"t",style:{fontSize:"13px"}},fmtDate(r.when)+(r.sv<2?" · v3":"")),h("div",{className:"d"},r.sections+(r.subject?" · "+r.subject:""))));})),
        h(Reminder));
    }
    return h(React.Fragment,null,
      h("div",{className:"center",style:{marginBottom:"18px"}},
        h("h1",{className:"h1"},"📈 내 누적 기록"),
        h("p",{className:"hint"},nameT+" · "+clsT+(hist&&hist.source==="local"?" · 이 기기 기록":hist&&hist.source==="server"?" · 서버 기록":""))),
      body,
      h("div",{className:"nav"},
        h("button",{type:"button",className:"btn btn-ghost",onClick:function(){setScreen("home");}},"🏠 처음으로"),
        hist&&!hist.loading&&h("button",{type:"button",className:"btn btn-soft",onClick:openHistory},"🔄 새로고침")));
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
